<!DOCTYPE html>
<html lang="fa" dir="rtl">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{% endblock %}</title>

    <!-- 🧱 Base Styles -->
    <link rel="stylesheet" href="{% static 'css/parent/fonts.css' %}">
    <link rel="stylesheet" href="{% static 'css/parent/base.css' %}">
    <link rel="icon" href="{% static 'icons/favicon.ico' %}">

    <!-- 📦 Block for extra page-specific styles -->
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- ✅ PWA Manifest -->
    <link rel="manifest" href="{% static 'main/manifest.json' %}">
    <meta name="theme-color" content="#d4af37">

    <!-- ✅ PWA Icons -->
    <link rel="apple-touch-icon" sizes="192x192" href="{% static 'icons/icon-192x192.png' %}">
    <link rel="apple-touch-icon" sizes="512x512" href="{% static 'icons/icon-512x512.png' %}">

    <!-- ✅ Display standalone mode -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="مسجد رضویه افسریه">

    {% block seo %}{% endblock %}

</head>

<body data-auth="{{ request.user.is_authenticated|yesno:'true,false' }} " data-theme="dark">
<!-- 🕌 Loader -->
<div id="page-loader">
    <div class="loader-glow"></div>
    <div class="loader-ring"></div>
    <img src="{% static 'icons/logo.png' %}" alt="مسجد رضویه" class="loader-logo">
    <div class="loader-text">یا ضامن آهو</div>
</div>
<!-- 🕌 Header (optional include later) -->
{% include 'partials/header.html' %}

<!-- 📜 Main content -->
<main class="container">
    {% block body %}{% endblock %}
</main>

<!-- 🦶 Footer -->
{% include 'partials/footer.html' %}

<!-- 🔧 Page-specific scripts -->
{% block scripts %}

{% endblock %}
<script src="{% static 'js/base.js' %}"></script>
<script src="{% static 'js/global_lightbox.js' %}"></script>
<!-- global lightbox (put once, e.g. in base template) -->
<div id="global-lightbox" class="lightbox" aria-hidden="true" role="dialog" tabindex="-1">
    <div class="lb-backdrop"></div>

    <button class="lb-btn prev" aria-label="Previous">&#10094;</button>
    <button class="lb-btn next" aria-label="Next">&#10095;</button>

    <div class="lb-inner">
        <img class="lightbox-img" src="" alt="">
        <div class="lb-counter"></div>
        <button class="lb-download" title="دانلود"><img src="{% static 'icons/download.svg' %}" alt="download"></button>
        <button class="lb-close" aria-label="Close">&times;</button>
    </div>
</div>
</body>
</html>
