{# templates/report/partials/media_videos.html #}
<section class="report-media-section report-videos-section fade-up" aria-live="polite">
    <h2 class="section-title">ویدیوها</h2>

    <div class="video-grid">
        {% for video in report.videos.all %}
            <div class="video-card" data-player="{{ video.player_url }}">
                <div class="video-thumb">
                    <img src="{{ video.thumbnail_url }}" alt="{{ video.title }}">
                    <div class="video-play-btn"></div>
                </div>
                <div class="video-info">
                    <h3 class="video-title">{{ video.title }}</h3>

                    {% if video.description %}
                        <p class="video-desc">{{ video.description|linebreaks }}</p>
                    {% endif %}
                </div>
            </div>
        {% endfor %}
    </div>

</section>
